name: fetch

# Downloads the forecasts and settled outcomes from Energi Data Service and commits them with
# their SHA-256 in data/manifest.json. Runs when the fetcher changes, or by hand.
on:
  push:
    paths: ["tools/fetch.py", ".github/workflows/fetch.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download from Energi Data Service
        run: python3 tools/fetch.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit the data
        run: |
          git add data
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qm "data: downloaded $(date -u +%F)"
            for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
          fi
